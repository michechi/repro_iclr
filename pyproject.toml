[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iclr-sequence-paper"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "pandas>=2.1", "scipy>=1.10", "scikit-learn>=1.3",
    "joblib>=1.3", "matplotlib>=3.7", "PyYAML>=6.0.1", "pyarrow>=14",
    "torch>=2.0", "xgboost>=2.0", "tqdm>=4.65",
]

[project.optional-dependencies]
models = [
    "transformers>=5.14.1", "peft>=0.19.1", "accelerate>=1.14.0",
    "huggingface-hub>=1.24.0", "safetensors>=0.8.0", "bitsandbytes>=0.50.2",
    "datasets>=2.14", "sentencepiece>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "scripts", "scripts.*"]
exclude = ["*.__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
